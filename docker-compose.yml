# PulseFlow local stack: infra + workflow + gateway + admin UI.
# docker compose -f pulseflow/docker-compose.yml up -d --build

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: pulseflow-zookeeper
    ports:
      - "${PULSEFLOW_ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: pulseflow-kafka
    ports:
      - "${PULSEFLOW_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${PULSEFLOW_KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-setup:
    image: confluentinc/cp-kafka:7.4.0
    container_name: pulseflow-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - ./docker/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]

  flashcache:
    build:
      context: ../flashcache
      dockerfile: server/Dockerfile
    container_name: pulseflow-flashcache
    ports:
      - "${PULSEFLOW_FLASHCACHE_PORT:-7654}:7654"
      - "${PULSEFLOW_FLASHCACHE_METRICS_PORT:-7655}:7655"
    environment:
      FLASHCACHE_PORT: "7654"
      FLASHCACHE_METRICS_PORT: "7655"
      FLASHCACHE_MAX_KEYS: "500000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7655/metrics >/dev/null"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: pulseflow-postgres
    ports:
      - "${PULSEFLOW_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${PULSEFLOW_POSTGRES_USER:-pulseflow}
      POSTGRES_PASSWORD: ${PULSEFLOW_POSTGRES_PASSWORD:-pulseflow}
      POSTGRES_DB: ${PULSEFLOW_POSTGRES_DB:-pulseflow}
    volumes:
      - pulseflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PULSEFLOW_POSTGRES_USER:-pulseflow} -d ${PULSEFLOW_POSTGRES_DB:-pulseflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pulseflow-kafka-ui
    ports:
      - "${PULSEFLOW_KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pulseflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      kafka:
        condition: service_healthy

  workflow:
    build:
      context: ..
      dockerfile: pulseflow/backend/Dockerfile
    container_name: pulseflow-workflow
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PULSEFLOW_NTFY_TOPIC: ${PULSEFLOW_NTFY_TOPIC:-silversoul_alerts}
      PULSEFLOW_NOTIFICATIONS_NTFY_ACCESSTOKEN: ${NTFY_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      flashcache:
        condition: service_healthy
      kafka:
        condition: service_healthy
    expose:
      - "8082"

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: pulseflow-gateway
    ports:
      - "${PULSEFLOW_GATEWAY_PORT:-8080}:8080"
    environment:
      PULSEFLOW_WORKFLOW_BASE_URL: http://workflow:8082
    depends_on:
      workflow:
        condition: service_healthy

  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    container_name: pulseflow-admin-ui
    ports:
      - "${PULSEFLOW_UI_PORT:-3000}:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  pulseflow-postgres-data:
